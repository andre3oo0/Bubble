<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Bubble</title>
  <desc id="desc">Bubble's logo over a calm night ocean: a calm place to talk things through.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="1" stop-color="#174f86"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#c9ecff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6fc1ee" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="96" cy="64" r="1.6"/><circle cx="212" cy="122" r="1.2"/><circle cx="340" cy="48" r="1.4"/>
    <circle cx="468" cy="98" r="1"/><circle cx="822" cy="56" r="1.4"/><circle cx="930" cy="128" r="1.1"/>
    <circle cx="1046" cy="78" r="1.5"/><circle cx="1188" cy="40" r="1.2"/><circle cx="1220" cy="150" r="1"/>
    <circle cx="150" cy="190" r="1.1"/><circle cx="1110" cy="210" r="1.2"/>
  </g>

  <!-- Moon -->
  <circle cx="1072" cy="112" r="34" fill="#e7e2d4" opacity="0.85"/>

  <!-- Sea -->
  <path d="M0 300 C 160 282 320 314 480 298 S 800 282 960 298 S 1180 312 1280 296 V 400 H 0 Z" fill="#0f3a63"/>
  <path d="M0 330 C 200 316 360 344 560 330 S 900 314 1080 332 S 1220 338 1280 328 V 400 H 0 Z" fill="#0c2f52"/>
  <path d="M0 362 C 180 352 420 374 640 362 S 1020 350 1280 364 V 400 H 0 Z" fill="#0a2644"/>

  <!-- Logo and name -->
  <g transform="translate(386 108)">
    <g transform="scale(3.4)">
      <circle cx="16" cy="16" r="14.5" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5"/>
      <ellipse cx="11" cy="10.5" rx="4.2" ry="2.6" transform="rotate(-35 11 10.5)" fill="#ffffff" opacity="0.9"/>
      <circle cx="22.5" cy="21.5" r="1.6" fill="#ffffff" opacity="0.6"/>
    </g>
    <text x="140" y="78" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#ffffff">Bubble</text>
    <text x="142" y="126" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#d6ecfa">A calm place to talk things through</text>
  </g>
</svg>
