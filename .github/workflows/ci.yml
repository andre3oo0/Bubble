name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks code, it never writes to the repo
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on high or critical advisories in anything the app ships with
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build
